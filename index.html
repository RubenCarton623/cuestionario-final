        background: #007bff;
        color: white;

    }

        font-weight: bold;
        margin-top: 8px;
        text-align: center;

    const btnRegresar = document.getElementById("regresar");
    const btnReiniciar = document.getElementById("reiniciar");

    function mostrarBotones() {
    btnRegresar.style.display = "block";
    btnReiniciar.style.display = "block";
    }

    function ocultarBotones() {
    btnRegresar.style.display = "none";
    btnReiniciar.style.display = "none";
    }
    
    function iniciarPreguntas(tipo) {
        document.getElementById("menu-inicial").style.display = "none";
        document.getElementById("contador").style.display = "block";

        btnReiniciar.style.display = "block";
        btnRegresar.style.display = "block";

        if (tipo === 1) preguntas = json1;
        else if (tipo === 2) preguntas = json2;
        else if (tipo === 3) preguntas = json3;
        else if (tipo === 4) preguntas = json4;
        else if (tipo === 5) preguntas = json5;

        usadas = [];
        correctas = 0;
        indiceActual = 0;
        actualizarContador();
        mostrarPregunta();
    }

    function actualizarContador() {
      document.getElementById("contador").textContent = `✅ Correctas: ${correctas}`;
    }

    function obtenerPreguntaAleatoria() {
      const disponibles = preguntas.filter((_, i) => !usadas.includes(i));
      if(disponibles.length===0) return null;
      const indice = Math.floor(Math.random()*disponibles.length);
      const indiceReal = preguntas.indexOf(disponibles[indice]);
      usadas.push(indiceReal);
      return preguntas[indiceReal];
    }

    function mostrarPregunta() {
      const p = obtenerPreguntaAleatoria();
      const contenedor = document.getElementById("contenedor");

      if(!p) {
        contenedor.innerHTML = `<h3>¡Has terminado todas las preguntas! 🎉</h3>
          <p>Tu puntaje final fue: <b>${correctas} / ${preguntas.length}</b></p>
          <p>Pulsa "Reiniciar" para volver a empezar.</p>`;
        return;
      }

      indiceActual++;

      contenedor.innerHTML = `
        <p><b>Pregunta ${indiceActual} de ${preguntas.length}</b></p>
        <h3>${p.pregunta}</h3>
        ${p.opciones.map(o=>`<label class="opcion"><input type="radio" name="opcion" value="${o}"> ${o}</label>`).join("")}
        <button onclick="verificar('${p.respuesta.replace(/'/g,"\\'")}')">Responder</button>
        <div id="mensaje"></div>
      `;
    }

    function verificar(respuestaCorrecta){
      const seleccion=document.querySelector('input[name="opcion"]:checked');
      const mensaje=document.getElementById("mensaje");

      if(!seleccion){
        mensaje.textContent="Selecciona una respuesta.";
        mensaje.style.color="orange";
        return;
      }

      if(seleccion.value===respuestaCorrecta){
        mensaje.textContent="✅ ¡Correcto!";
        mensaje.style.color="green";
        correctas++;
        actualizarContador();
      }else{
        mensaje.textContent=`❌ Incorrecto. La respuesta correcta era: ${respuestaCorrecta}`;
        mensaje.style.color="red";
      }

      setTimeout(mostrarPregunta,3500);
    }

    // Botón “Reiniciar” → reinicia el mismo conjunto de preguntas
    btnReiniciar.addEventListener("click", () => {
    usadas = [];
    correctas = 0;
    indiceActual = 0;
    actualizarContador();
    mostrarPregunta();
    });

    // Botón “Regresar al menú” → vuelve al menú inicial
    btnRegresar.addEventListener("click", () => {

    document.getElementById("contador").style.display = "none";
    document.getElementById("contenedor").innerHTML = "";
    btnReiniciar.style.display = "none";
    btnRegresar.style.display = "none";
    });

    function mostrarMenuPreguntas() {

        document.getElementById("menu-inicial").style.display = "none";

    function mostrarTodasPreguntas(tipo) {

        let conjunto;

        if (tipo === 1) conjunto = json1;
        else if (tipo === 2) conjunto = json2;
        else if (tipo === 3) conjunto = json3;
        else if (tipo === 4) conjunto = json4;
        else if (tipo === 5) conjunto = json5;

        const contenedor = document.getElementById("contenedor");

        document.getElementById("menu-preguntas").style.display = "none";
        document.getElementById("contador").style.display = "none";

        contenedor.innerHTML = `
            <div style="
                background:white;
                padding:15px;
                border-radius:10px;
                margin-bottom:15px;
            ">
                <h2 style="text-align:center;">
                    📚 Semana ${tipo}
                </h2>

                <p style="text-align:center;">
                    ${conjunto.length} preguntas
                </p>
            </div>
        `;

        const boton = document.createElement("button");

        boton.textContent = "⬅️ Volver al menú de semanas";
        boton.style.background = "#6c757d";

        boton.onclick = function () {
            document.getElementById("contenedor").innerHTML = "";
            document.getElementById("menu-preguntas").style.display = "block";
        };

        contenedor.appendChild(boton);

        conjunto.forEach((p, index) => {

            const preguntaHTML = document.createElement("div");

            preguntaHTML.style.background = "white";
            preguntaHTML.style.padding = "15px";
            preguntaHTML.style.marginBottom = "15px";
            preguntaHTML.style.borderRadius = "10px";
            preguntaHTML.style.border = "1px solid #ddd";

            preguntaHTML.innerHTML = `
                <p>
                    <b>Pregunta ${index + 1}</b>
                </p>

                <h3 style="font-size:1rem;">
                    ${p.pregunta}
                </h3>

                ${p.opciones.map((opcion, i) => `
                    <div style="
                        padding:8px;
                        margin:5px 0;
                        border-radius:6px;
                        background:${opcion === p.respuesta ? '#d4edda' : '#f8f9fa'};
                        border:1px solid ${opcion === p.respuesta ? '#28a745' : '#ddd'};
                    ">
                        ${String.fromCharCode(65 + i)}. ${opcion}
                        ${opcion === p.respuesta ? ' ✅' : ''}
                    </div>
                `).join("")}

                <p style="
                    margin-top:10px;
                    padding:10px;
                    background:#e8f5e9;
                    border-radius:6px;
                    color:#155724;
                ">
                    <b>✅ Respuesta correcta:</b><br>
                    ${p.respuesta}
                </p>
            `;

            contenedor.appendChild(preguntaHTML);
        });
        
    }


    function regresarMenuPrincipal() {

        document.getElementById("menu-preguntas").style.display = "none";
        document.getElementById("menu-inicial").style.display = "block";

        document.getElementById("contenedor").innerHTML = "";
    }
