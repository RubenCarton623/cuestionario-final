                "Desarrollar e implementar salvaguardas para limitar el impacto de un incidente.",
                "Restaurar las capacidades o servicios que resultaron afectados.",
                "Identificar todos los activos físicos y digitales de la empresa.",
                "Detectar en tiempo real la ocurrencia de un evento de ciberseguridad."
            ],
            "respuesta": "Desarrollar e implementar salvaguardas para limitar el impacto de un incidente."
        },
        {
            "pregunta": "En la clasificación de la información relativa a la 'integridad', ¿qué caracteriza a la clase 'Especial'?",
            "opciones": [
                "Es información que solo debe estar disponible en horario de oficina.",
                "La información debe estar permanentemente actualizada y su alteración incurre en responsabilidad.",
                "La información es de solo lectura y no requiere actualizaciones.",
                "Solo afecta a la imagen pública de la organización si se modifica."
            ],
            "respuesta": "La información debe estar permanentemente actualizada y su alteración incurre en responsabilidad."
        },
        {
            "pregunta": "En el ciclo PDCA, ¿qué ocurre durante la fase de 'Actuar' (Act)?",
            "opciones": [
                "Se definen los activos de información.",
                "Se ejecutan tareas de mantenimiento y propuestas de mejora.",
                "Se seleccionan los controles de seguridad.",
                "Se implementa el sistema de gestión por primera vez."
            ],
            "respuesta": "Se ejecutan tareas de mantenimiento y propuestas de mejora."
        },
        {
            "pregunta": "Dentro de las medidas de seguridad, ¿dónde se clasificaría la elección de la ubicación de los sistemas y la construcción de la sala?",
            "opciones": [
                "Medidas físicas.",
                "Medidas organizativas.",
                "Medidas técnicas.",
                "Medidas legales."
            ],
            "respuesta": "Medidas físicas."
        }
    ];
    const btnRegresar = document.getElementById("regresar");
    const btnReiniciar = document.getElementById("reiniciar");

    function mostrarBotones() {
    btnRegresar.style.display = "block";
    btnReiniciar.style.display = "block";
    }

    function ocultarBotones() {
    btnRegresar.style.display = "none";
    btnReiniciar.style.display = "none";
    }
    
    function iniciarPreguntas(tipo) {
        document.getElementById("menu-inicial").style.display = "none";
        document.getElementById("contador").style.display = "block";

        btnReiniciar.style.display = "block";
        btnRegresar.style.display = "block";

        if (tipo === 1) preguntas = json1;
        else if (tipo === 2) preguntas = json2;
        else if (tipo === 3) preguntas = json3;
        else if (tipo === 4) preguntas = json4;

        usadas = [];
        correctas = 0;
        indiceActual = 0;
        actualizarContador();
        mostrarPregunta();
    }

    function actualizarContador() {
      document.getElementById("contador").textContent = `✅ Correctas: ${correctas}`;
    }

    function obtenerPreguntaAleatoria() {
      const disponibles = preguntas.filter((_, i) => !usadas.includes(i));
      if(disponibles.length===0) return null;
      const indice = Math.floor(Math.random()*disponibles.length);
      const indiceReal = preguntas.indexOf(disponibles[indice]);
      usadas.push(indiceReal);
      return preguntas[indiceReal];
    }

    function mostrarPregunta() {
      const p = obtenerPreguntaAleatoria();
      const contenedor = document.getElementById("contenedor");

      if(!p) {
        contenedor.innerHTML = `<h3>¡Has terminado todas las preguntas! 🎉</h3>
          <p>Tu puntaje final fue: <b>${correctas} / ${preguntas.length}</b></p>
          <p>Pulsa "Reiniciar" para volver a empezar.</p>`;
        return;
      }

      indiceActual++;

      contenedor.innerHTML = `
        <p><b>Pregunta ${indiceActual} de ${preguntas.length}</b></p>
        <h3>${p.pregunta}</h3>
        ${p.opciones.map(o=>`<label class="opcion"><input type="radio" name="opcion" value="${o}"> ${o}</label>`).join("")}
        <button onclick="verificar('${p.respuesta.replace(/'/g,"\\'")}')">Responder</button>
        <div id="mensaje"></div>
      `;
    }

    function verificar(respuestaCorrecta){
      const seleccion=document.querySelector('input[name="opcion"]:checked');
      const mensaje=document.getElementById("mensaje");

      if(!seleccion){
        mensaje.textContent="Selecciona una respuesta.";
        mensaje.style.color="orange";
        return;
      }

      if(seleccion.value===respuestaCorrecta){
        mensaje.textContent="✅ ¡Correcto!";
        mensaje.style.color="green";
        correctas++;
        actualizarContador();
      }else{
        mensaje.textContent=`❌ Incorrecto. La respuesta correcta era: ${respuestaCorrecta}`;
        mensaje.style.color="red";
      }

      setTimeout(mostrarPregunta,1500);
    }

    // Botón “Reiniciar” → reinicia el mismo conjunto de preguntas
    btnReiniciar.addEventListener("click", () => {
    usadas = [];
    correctas = 0;
    indiceActual = 0;
    actualizarContador();
    mostrarPregunta();
    });

    // Botón “Regresar al menú” → vuelve al menú inicial
    btnRegresar.addEventListener("click", () => {
    document.getElementById("menu-inicial").style.display = "block";
    document.getElementById("contador").style.display = "none";
    document.getElementById("contenedor").innerHTML = "";
    btnReiniciar.style.display = "none";
    btnRegresar.style.display = "none";
    });
  </script>
</body>
</html>
